name: CPU Pressure Test

on:
  pull_request:
    branches: [main]

jobs:
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: CPU pressure suite
        run: npx vitest run lib/cpu/__tests__/cpuPressureTest.test.ts
