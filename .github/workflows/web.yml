name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Phase regressions, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm 10.8.2 can crash in Arborist peer-set resolution ("edgesOut")
      # with this dependency graph. npm 11.6.0+ includes the upstream fix.
      - name: Enforce Dokkit non-negotiables copy guard
        run: node scripts/check-non-negotiables.mjs

      - name: Update npm to a fixed Arborist release
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm install

      # Keep the broad repository suite visible while its known baseline failures
      # are repaired separately. The phase-specific regression gates below and
      # the production build remain blocking.
      - name: Full-suite diagnostic (known baseline failures; non-blocking)
        run: npm test
        continue-on-error: true

      - name: Capture → Dock regression gates
        run: npm run test:phaseB && npm run test:phase20 && npm run test:phaseM && npm run test:phase18 && npm run test:phase15 && npm run test:phase16 && npm run test:phase17 && npm run test:phase12-integration

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci
          SUPABASE_SERVICE_ROLE_KEY: service-role-key-for-ci
