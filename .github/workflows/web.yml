name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Phase regressions, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Keep the broad repository suite visible while its known baseline failures
      # are repaired separately. The phase-specific regression gates below and
      # the production build remain blocking.
      - name: Full-suite diagnostic (known baseline failures; non-blocking)
        run: npm test
        continue-on-error: true

      - name: Capture → Dock regression gates
        run: npm run test:phase18 && npm run test:phase15 && npm run test:phase16 && npm run test:phase17 && npm run test:phase12-integration

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci
