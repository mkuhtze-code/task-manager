name: Phase L Live Task Continuity Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-l-live-task-continuity
  cancel-in-progress: false

jobs:
  live-task-continuity:
    name: Real task insert, remote context recovery, and same-row update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'

      - name: Install dependencies
        # Use pnpm rather than npm's Arborist resolver, which has repeatedly
        # crashed with "Cannot read properties of null (reading 'edgesOut')"
        # in this repository's live-test workflow.
        run: pnpm install --no-frozen-lockfile

      - name: Run Phase L against live Supabase
        run: pnpm exec vitest run lib/engine/__tests__/phaseLLiveTaskContinuity.test.ts
        env:
          PHASE_L_LIVE_TESTS: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PHASE_K_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PHASE_K_SUPABASE_ANON_KEY }}
          PHASE_K_USER_A_EMAIL: ${{ secrets.PHASE_K_USER_A_EMAIL }}
          PHASE_K_USER_A_PASSWORD: ${{ secrets.PHASE_K_USER_A_PASSWORD }}
