<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dokkit — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f1efe6;
      color: #1a2933;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    .card { max-width: 320px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { font-size: 14px; color: #5c6d76; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Dokkit needs a connection to load your tasks. Everything's still there — reconnect when you're ready.</p>
  </div>
</body>
</html>
